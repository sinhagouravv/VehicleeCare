<!doctype html>
<html lang="en">

<head>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      fetch('http://localhost:9999/log', { method: 'POST', body: message + ' \nStack: ' + (error ? error.stack : '') });
    };
    window.addEventListener('unhandledrejection', function(event) {
      fetch('http://localhost:9999/log', { method: 'POST', body: 'Unhandled Promise Rejection: ' + (event.reason ? event.reason.stack || event.reason : 'unknown') });
    });
    const originalError = console.error;
    console.error = function(...args) {
      fetch('http://localhost:9999/log', { method: 'POST', body: 'Console Error: ' + args.join(' ') });
      originalError.apply(console, args);
    }
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VehicleeCare | Garage</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
