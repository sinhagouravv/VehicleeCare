<!DOCTYPE html>
<html>
  <head>
    <title>Maps</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCgdWL8F_-ZXY2xhQmpCxn0A3zWWeYvYWI&libraries=places"></script>
  </head>
  <body>
    <div id="map" style="width: 100%; height: 400px;"></div>
    <script>
      function initMap() {
        new google.maps.Map(document.getElementById("map"), {
          center: { lat: -34.397, lng: 150.644 },
          zoom: 8,
        });
      }
      if (window.google) initMap();
    </script>
  </body>
</html>
